name: Deploy Hotel KPI Dashboard

# Publishes the static, client-side dashboard app to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "Hotel Reservations.csv"
      - ".github/workflows/update report.yml"
  workflow_dispatch:        # allow manual runs from the Actions tab

# Permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; don't cancel an in-progress run
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html _site/
          cp "Hotel Reservations.csv" _site/
          cp -r css _site/
          cp -r js _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
